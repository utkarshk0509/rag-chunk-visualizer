[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chunk-visualizer"
version = "0.1.0"
description = "Inspect how character, sentence and markdown chunking split a file before embedding it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "tiktoken>=0.7",
    "typer>=0.12",
]

[project.scripts]
chunk-viz = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test.py", "test_*.py", "*_test.py"]
